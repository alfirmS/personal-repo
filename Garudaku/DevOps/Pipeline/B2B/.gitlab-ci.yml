#===================================================================================DEPLOYMENT===================================================================================
#===================================================================================WHITELIST====================================================================================
    
prepare-repo-whitelist:
  only:
    - master
  stage: preparation
  before_script:
    - echo "Preparing Repository Production in Staging Server"
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - echo -n "$B2B_WHITELIST_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - ssh-keyscan "$(echo "$B2B_WHITELIST_ACCESS" | cut -d@ -f2)" >> ~/.ssh/known_hosts
  script:
    - echo "${B2B_WHITELIST_ACCESS}"
    - ssh -vvv -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostkeyAlgorithms=+ssh-rsa -p22 ${B2B_WHITELIST_ACCESS} "git -C /var/www/docker/garudaku-b2b remote prune origin"
    - ssh -p22 ${B2B_WHITELIST_ACCESS} "git -C /var/www/docker/garudaku-b2b fetch"
    #- ssh -p22 ${B2B_WHITELIST_ACCESS} "git -C /var/www/docker/garudaku-b2b checkout lumen/storage/api-docs/api-docs.json"
    - ssh -p22 ${B2B_WHITELIST_ACCESS} "git -C /var/www/docker/garudaku-b2b checkout master"
    - ssh -p22 ${B2B_WHITELIST_ACCESS} "git -C /var/www/docker/garudaku-b2b pull origin master"
    - ssh -p22 ${B2B_WHITELIST_ACCESS} "git -C /var/www/docker/garudaku-b2b submodule update --recursive --init --remote"
    #- ssh -p22 ${B2B_WHITELIST_ACCESS} "/usr/local/bin/docker-compose -f /var/www/docker/garudaku-b2b/docker-compose-production.yml stop"
    - ssh -p22 ${B2B_WHITELIST_ACCESS} "composer install --working-dir=/var/www/docker/garudaku-b2b/lumen-b2b"
    - ssh -p22 ${B2B_WHITELIST_ACCESS} "composer install --working-dir=/var/www/docker/garudaku-b2b/lumen-finance"
    - ssh -p22 ${B2B_WHITELIST_ACCESS} "composer install --working-dir=/var/www/docker/garudaku-b2b/lumen-supplier"
	
