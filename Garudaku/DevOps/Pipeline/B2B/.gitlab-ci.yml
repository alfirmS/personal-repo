update-worker:
  only:
    - master
  stage: production
  needs: [prepare-repo-production]
  before_script:
    - echo "Update Worker"
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - echo -n "$B2B_WORKER_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - ssh-keyscan "$(echo "$B2B_WORKER_ACCESS" | cut -d@ -f2)" >> ~/.ssh/known_hosts
  script:
    - ssh -p22 ${B2B_WORKER_ACCESS} "git -C /var/www/docker/garudaku-b2b remote prune origin"
    - ssh -p22 ${B2B_WORKER_ACCESS} "git -C /var/www/docker/garudaku-b2b fetch"
    - ssh -p22 ${B2B_WORKER_ACCESS} "git -C /var/www/docker/garudaku-b2b checkout staging"
    - ssh -p22 ${B2B_WORKER_ACCESS} "git -C /var/www/docker/garudaku-b2b pull origin staging"
    - ssh -p22 ${B2B_WORKER_ACCESS} "git -C /var/www/docker/garudaku-b2b submodule update --recursive --init --remote"
    - ssh -p22 ${B2B_WORKER_ACCESS} "composer install --working-dir=/var/www/docker/garudaku-b2b/lumen-b2b"
    - ssh -p22 ${B2B_WORKER_ACCESS} "composer install --working-dir=/var/www/docker/garudaku-b2b/lumen-finance"
    - ssh -p22 ${B2B_WORKER_ACCESS} "composer install --working-dir=/var/www/docker/garudaku-b2b/lumen-supplier"
    - ssh -p22 ${B2B_WORKER_ACCESS} "sudo supervisorctl reread && sudo supervisorctl update"

