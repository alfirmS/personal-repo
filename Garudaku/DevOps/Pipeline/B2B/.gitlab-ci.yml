image: php:8.2-cli
stages:
  - preparation #compile and composer installation
  - staging #migrate and update staging
  - production
  - prepare_repo_master
  - prepare_image
  - deploy_api
  # - deploy_platform

#==============================================================================DEPLOYMENT========================================================================================
#===============================================================================STAGING==========================================================================================

# Dev Yamisok
# Group : Staging 0 - Desprecated
prepare-repo:
  only:
    - staging
  stage: preparation
  before_script:
    - echo "Preparing Repository"
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - echo -n "$B2B_STAGING_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - ssh-keyscan "$(echo "$B2B_STAGING_ACCESS" | cut -d@ -f2)" >> ~/.ssh/known_hosts
  script:
    - ssh -p22 ${B2B_STAGING_ACCESS} "git -C /var/www/docker/garudaku-b2b remote prune origin"
    - ssh -p22 ${B2B_STAGING_ACCESS} "git -C /var/www/docker/garudaku-b2b fetch"
    - ssh -p22 ${B2B_STAGING_ACCESS} "git -C /var/www/docker/garudaku-b2b checkout staging"
    - ssh -p22 ${B2B_STAGING_ACCESS} "git -C /var/www/docker/garudaku-b2b pull origin staging"
    - ssh -p22 ${B2B_STAGING_ACCESS} "git -C /var/www/docker/garudaku-b2b submodule update --recursive --init --remote"

# Dev Yamisok
# Group : Staging 0 - Desprecated
update-docker:
  only:
    - staging
  needs: [prepare-repo]
  stage: staging
  before_script:
    - echo "Update Docker Staging"
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - echo -n "$B2B_STAGING_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - ssh-keyscan "$(echo "$B2B_STAGING_ACCESS" | cut -d@ -f2)" >> ~/.ssh/known_hosts
  script:
    - ssh -p22 ${B2B_STAGING_ACCESS} "/usr/local/bin/docker-compose -f /var/www/docker/garudaku-b2b/docker-compose-staging.yml stop"
    - ssh -p22 ${B2B_STAGING_ACCESS} "/usr/local/bin/docker-compose -f /var/www/docker/garudaku-b2b/docker-compose-staging.yml up -d"
    - ssh -p22 ${B2B_STAGING_ACCESS} "/usr/local/bin/docker-compose -f /var/www/docker/garudaku-b2b/docker-compose-staging.yml scale lumen_b2b=1 lumen_finance=1 lumen_supplier=1"

    - ssh -p22 ${B2B_STAGING_ACCESS} "echo -n "" > /var/www/docker/garudaku-b2b/.lumen-b2b_container"
    - ssh -p22 ${B2B_STAGING_ACCESS} "docker ps -aqf 'name=garudaku-b2b_lumen_b2b' | head -n 1 >> /var/www/docker/garudaku-b2b/.lumen-b2b_container"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen-b2b_container"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen-b2b_container | xargs -I % docker exec -t % composer install"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen-b2b_container | xargs -I % docker exec -t % php artisan migrate"

    - ssh -p22 ${B2B_STAGING_ACCESS} "echo -n "" > /var/www/docker/garudaku-b2b/.lumen-finance_container"
    - ssh -p22 ${B2B_STAGING_ACCESS} "docker ps -aqf 'name=garudaku-b2b_lumen_finance' | head -n 1 >> /var/www/docker/garudaku-b2b/.lumen-finance_container"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen-finance_container"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen-finance_container | xargs -I % docker exec -t % composer install"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen-finance_container | xargs -I % docker exec -t % php artisan migrate"

    - ssh -p22 ${B2B_STAGING_ACCESS} "echo -n "" > /var/www/docker/garudaku-b2b/.lumen-supplier_container"
    - ssh -p22 ${B2B_STAGING_ACCESS} "docker ps -aqf 'name=garudaku-b2b_lumen_supplier' | head -n 1 >> /var/www/docker/garudaku-b2b/.lumen-supplier_container"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen-supplier_container"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen-supplier_container | xargs -I % docker exec -t % composer install"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen-supplier_container | xargs -I % docker exec -t % php artisan migrate"
    
    #- ssh -p22 ${STAGING_ACCESS} "cat /var/www/docker/store/.lumen_container | xargs -I % docker exec -t % chmod -Rf 777 /var/www/storage/logs/*"
    #- ssh -p22 ${STAGING_ACCESS} "cat /var/www/docker/store/.lumen_container | xargs -I % docker exec -t % chmod -Rf 777 /var/www/storage/*"
    - ssh -p22 ${B2B_STAGING_ACCESS} "cat /var/www/docker/garudaku-b2b/.lumen_container | xargs -I % docker exec -t % chown -R www:www storage"
    - ssh -p22 ${B2B_STAGING_ACCESS} "/usr/local/bin/docker-compose -f /var/www/docker/garudaku-b2b/docker-compose-staging.yml scale lumen_b2b=1 lumen_finance=1 lumen_supplier=1"
	
